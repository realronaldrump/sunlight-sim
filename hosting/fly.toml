# Fly.io config for the multiplayer server. Deploy: fly launch --no-deploy --copy-config && fly deploy
app = "sunlight-sim-server"
primary_region = "den"

[build]
  dockerfile = "../server/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
