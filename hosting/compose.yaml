services:
  multiplayer:
    image: sunlight-multiplayer:${RELEASE_SHA:?Set the deployed Git commit}
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: sunlight-multiplayer
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8787:8080"
    environment:
      PORT: "8080"
      RELEASE_SHA: ${RELEASE_SHA}
      GUEST_STATE_FILE: /var/lib/sunlight/mountain-guests.json
    volumes:
      - mountain-guests:/var/lib/sunlight
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  mountain-guests:
